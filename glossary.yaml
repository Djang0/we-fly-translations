# We-Fly glossary: how pilots actually say it.
#
# Every translation (human or AI) follows this file. When a term has several
# valid forms, the first one is the default; `alt` lists accepted variants and
# `note` says when to use them. Suggest changes by PR or on Weblate; pilots
# from each community have the last word on their language.
#
# `keep: true` means: never translate, keep the exact spelling.

do_not_translate:
  - We-Fly
  - Cockpit        # We-Fly's statistics dashboard (product name)
  - IGC
  - XContest
  - WeGlide
  - XCTrack
  - Flyskyhy
  - SeeYou
  - OpenAIP
  - autorouter
  - NOTAM
  - FAI
  - CIVL
  - WebDAV
  - OAuth
  - GPS
  - AGL            # explain once if needed, keep the acronym
  - XC             # keep in compounds like "XC planner"; the long form is translated

